}

.container {

    padding: 30px;
    border-radius: 20px;
    max-width: 500px;
    margin: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

h1 {

}

}

    border-radius: 10px;

    color: white;

    cursor: pointer;
}

#result {

canvas {

    top: 0;

function cekKelulusan() {
    let input = document.getElementById("nama").value.toLowerCase().trim();
    let result = document.getElementById("result");

    if (input === "sri astuti") {
        result.innerHTML = `
        <p style="color:#e63946;"><b>Tetap Semangat 🌱</b></p>
        <p>Perjalanan setiap orang berbeda. Hari ini mungkin belum sesuai harapan,
        tapi bukan akhir dari segalanya. Tetaplah melangkah, karena masa depanmu
        masih luas dan penuh kemungkinan indah.</p>`;
        return;
    }

    if (lulus.includes(input)) {
        result.innerHTML = `
        <h2 style="color:#2a9d8f;">SELAMAT 🎓✨</h2>
        <p>
        Hari ini bukan sekadar akhir dari sebuah perjalanan, 
        tetapi awal dari langkah-langkah besar yang akan kamu tempuh ke depan.
        Setiap usaha, doa, dan kerja kerasmu akhirnya berbuah manis.
        </p>
        <p>
        Teruslah melangkah dengan penuh keyakinan,
        jadilah pribadi yang berani bermimpi dan rendah hati dalam pencapaian.
        Dunia menunggumu dengan begitu banyak kemungkinan indah.
        </p>
        <p><b>Kamu dinyatakan LULUS.</b></p>
        `;
        startConfetti();
    } else {
        result.innerHTML = `<p>Nama tidak ditemukan</p>`;
    }
}

/* CONFETTI */
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let pieces = [];

function startConfetti() {
    for (let i = 0; i < 150; i++) {
        pieces.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 8 + 2,
            speed: Math.random() * 3 + 2
        });
    }
    animate();
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
        ctx.fillStyle = `hsl(${Math.random()*360},100%,50%)`;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        p.y += p.speed;
        if (p.y > canvas.height) p.y = 0;
    });
    requestAnimationFrame(animate);
}
</script>
